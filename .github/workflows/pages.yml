name: deploy-report-pages

# Publishes the BioModels batch-comparison report to GitHub Pages as the site
# index. Uploads the existing reports/batch_compare_first10.html straight from
# the repo (no committed duplicate); the report becomes
#   https://vivarium-collective.github.io/pbg-biomodels/
on:
  push:
    branches: [main]
    paths:
      - reports/batch_compare_first10.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the report as the site index
        run: |
          mkdir -p _site
          cp reports/batch_compare_first10.html _site/index.html
      - name: Configure Pages (enables Pages if not already)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
